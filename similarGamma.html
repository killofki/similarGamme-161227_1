<div id="output"></div> 

<script> 

(function(){ 
/// 

var output = $( '#output' ) 
var canvText = ` 
	0 31 
	0 63 
	31 63 
	0 95 
	31 95 
	0 127 
	63 95 
	31 127 
	0 159 
	63 127 
	31 159 
	0 191 
	95 127 
	63 159 
	31 191 
	0 223 
	95 159 
	63 191 
	31 223 
	0 255 
	127 159 
	95 191 
	63 223 
	31 255 
	127 191 
	95 223 
	63 255 
	159 191 
	127 223 
	95 255 
	159 223 
	127 255 
	191 223 
	159 255 
	191 255 
	` 
var canv = canvText .match( /\d+/g ) .map( t => + t ) 

fillRGB( canv, output, 1, 0, 0 ) 
output .appendChild( document .createElement( 'br' ) ) 
fillRGB( canv, output, 0, 1, 0 ) 
output .appendChild( document .createElement( 'br' ) ) 
fillRGB( canv, output, 0, 0, 1) 
output .appendChild( document .createElement( 'br' ) ) 
fillRGB( canv, output, 1, 1, 1 ) 

function fillRGB(canv, output, r, g, b) { 
	var i, cane 
	
	for ( i = 0; i < canv .length; i += 2 ) { 
		cane = document .createElement( 'canvas' ) 
		
		output.appendChild(cane) 
		canfil(canv[i], canv[i+1], cane, r, g, b) 
		
		output.appendChild(document.createTextNode((canv[i]+canv[i+1])/2+' ')) 
		} 
	} // -- fillRGB() 

function canfil( ac, bc, can, r, g, b ) { 
	var ia, iad 
	var tx = can .getContext( '2d' ) 
	var aav = ac * ac 
	var bbv = bc * bc 
	var cv0 = Math .floor( Math .sqrt( ( aav + bbv ) / 2 ) ) 
	var cv1 = cv0 + 1 
	var x, y, p, psum, dvv 
	var cvv = cv1 * cv1 
		
	var w = 100 
	var h = 100 
	var hw = w / 2 
	
	can .width = w 
	can .height = h 
	ia = tx .getImageData( 0, 0, w, h ) 
	iad = ia .data // 100x100x4(rgba) 
	p = 0 
	psum = 0 
	for ( y = 0; y < h; y += 1 ) { 
		for ( x = 0; x < w; x += 1 ) { 
			if ( x < hw ) { 
				} 
			else { 
				psum += cv0 * cv0 
				dvv = psum >= cvv ? cv1 : cv0 
				psum -= dvv * dvv 
				} 
			for (n=0; n<3; n++) { 
				if ( 
						   ( r && ( n == 0 ) ) 
						|| ( g && ( n == 1 ) ) 
						|| ( b && ( n == 2 ) ) 
						) { // rgb each 
					if ( x < hw ) { 
						iad[ p ] = ( y % 2 ) ? ac : bc 
						} 
					else { 
						iad[ p ] = dvv 
						} 
					} 
				else { // no rgb 
					iad[ p ] = 0 
					} 
				p += 1 
				} // -- for n 
			iad[ p ] = 255 // 0..100 
			p += 1 
			} // -- for x 
		} // -- for y 
	tx .putImageData( ia, 0, 0 ) 
	} // -- canfil() 

function $( q ) { return document .querySelector( q ) } 

/// 
	}()) 

	</script>
